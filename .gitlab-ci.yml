# GitLab CI for the USDX oracle extension, after tee-node's pipeline: the same
# Go cache, lint and coverage arrangement, extended to what this repository is
# made of — two Go modules (the extension at the root, the operator tooling in
# tools/), the operator scripts, and the extension image. The Foundry project is not
# built here: its sources are upstream's, compiled from a sibling checkout of
# flare-smart-contracts-v2 that CI has no access to; its wire vectors reach CI
# as the fixtures the Go conformance test replays.
#
# Two images are published, after flare-mixer's pipeline: the extension TEE
# image (./Dockerfile, the one a Confidential Space VM attests) and the keeper
# (keeper.Dockerfile). Both go through flarenetwork's release-image component to
# Flare's Artifact Registry, on tag pipelines only:
#
#   europe-west1-docker.pkg.dev/flare-network-staging/containers/tee-usdx
#   europe-west1-docker.pkg.dev/flare-network-staging/containers/fce-usdx-keeper
#
# No other pipeline builds an image. The proxy is tee-proxy's own published image, pulled by the compose stack, not
# built here.

variables:
  # tools/go.mod needs 1.25.8; the minor tag tracks the latest patch.
  GOLANG_VERSION: "1.25"
  GOLINT_VERSION: "v2.7.0"
  COVERAGE_FILE: "coverage.out"
  COBERTURA_FILE: "coverage.xml"
  FLARE_CI_DISABLE_LGTM: true
  FLARE_CI_DISABLE_TEST_GO: true
  FLARE_CI_DISABLE_LINT_GO: true
  # The generic component would publish one image per Dockerfile with kaniko,
  # which cannot build ./Dockerfile; the release-image jobs below replace it.
  FLARE_CI_DISABLE_RELEASE_IMAGE: true
  REGISTRY: europe-west1-docker.pkg.dev/flare-network-staging/containers
  IMAGE: $REGISTRY/tee-usdx
  KEEPER_IMAGE: $REGISTRY/fce-usdx-keeper
  # The chain whose deployed-addresses.json the keeper image bakes in.
  KEEPER_CHAIN: coston
  # WIF lives in flare-network-shared even though the images land in -staging.
  GCP_PROJECT: flare-network-shared
  GCP_PROJECT_NUMBER: '940168819002'
  # Read-only digest lookups use the unprotected identity: it is the lesser
  # privilege, and the one the component itself uses for every non-release push.
  UNPROTECTED_SERVICE_ACCOUNT_EMAIL: cr-oidc-cntnr-img-bldr@flare-network-shared.iam.gserviceaccount.com
  # Kept in sync with the component's `buildkit_image` default, so
  # verify-reproducible rebuilds with the BuildKit the published build used.
  BUILDKIT_IMAGE: europe-west1-docker.pkg.dev/flare-network-shared/ci-tools/buildkit-gcloud:v1.0.2
  PIPELINER_IMAGE: europe-west1-docker.pkg.dev/flare-network-shared/ci-tools/gcloud-pipeliner:v1.0.1

default:
  tags:
    - flarenetwork

# One pipeline per push. A branch with an open merge request runs as that merge
# request's pipeline and not also as a branch pipeline, so the merge request
# shows every job.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# A job without rules runs only in branch and tag pipelines (GitLab's default of
# only: [branches, tags]). Every job below extends this, so it also runs in the
# merge request pipelines the workflow creates.
.run:
  rules:
    - when: on_success

stages:
  - build
  - test
  - release-images
  - publish

.gocache:
  variables:
    GOPATH: ${CI_PROJECT_DIR}/.go
  before_script:
    - mkdir -p ${GOPATH}
  cache:
    key: go-${CI_COMMIT_REF_SLUG}
    paths:
      - ${GOPATH}/pkg/mod/
      - ${GOPATH}/bin

# ── build ─────────────────────────────────────────────────────────────────────

build:
  stage: build
  image: golang:${GOLANG_VERSION}
  extends: [.gocache, .run]
  needs: []
  script:
    - go mod download
    - go build ./...
    - cd tools && go mod download && go build ./...

# ── test ──────────────────────────────────────────────────────────────────────

# Formatting and vet, for both modules; what every commit must pass.
lint:
  stage: test
  needs: [build]
  image: golang:${GOLANG_VERSION}
  extends: [.gocache, .run]
  script:
    - "! gofmt -l $(git ls-files '*.go') | grep -q ."
    - go vet ./...
    - cd tools && go vet ./...

# tee-node's linter set (.golangci.yml), over both modules.
golangci:
  stage: test
  needs: [build]
  image: golangci/golangci-lint:${GOLINT_VERSION}
  extends: [.gocache, .run]
  script:
    - golangci-lint run --timeout 10m0s ./...
    - cd tools && golangci-lint run --timeout 10m0s ./...

# The extension's tests, with the wire-contract conformance replay
# (internal/extension TestConformance) among them, and the tooling's.
test:
  stage: test
  image: golang:${GOLANG_VERSION}
  needs: [build]
  extends: [.gocache, .run]
  before_script:
    - mkdir -p ${GOPATH}
    - go get github.com/boumenot/gocover-cobertura
  script:
    - go test -v -coverpkg=fce-usdx-oracle/... -coverprofile=${COVERAGE_FILE} -covermode count ./...
    - go tool cover -func=${COVERAGE_FILE}
    - go run github.com/boumenot/gocover-cobertura < ${COVERAGE_FILE} > ${COBERTURA_FILE}
    - cd tools && go test ./...
  artifacts:
    paths:
      - ${COVERAGE_FILE}
    reports:
      coverage_report:
        coverage_format: cobertura
        path: ${COBERTURA_FILE}
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'

# The operator scripts: every one parses, and the dependency pins the two Go
# modules and the proxy image carry agree (check-versions.sh).
scripts:
  stage: test
  needs: []
  extends: .run
  image: golang:${GOLANG_VERSION}
  script:
    - for f in deploy/scripts/*.sh deploy/scripts/lib/*.sh; do bash -n "$f"; done
    - ./deploy/scripts/check-versions.sh

# ── publish ───────────────────────────────────────────────────────────────────

# Every build here is BuildKit, not kaniko: kaniko supports neither
# `RUN --mount=type=cache` (Dockerfile) nor the rewrite-timestamp exporter option
# REPRODUCIBILITY.md depends on, and it does not read
# keeper.Dockerfile.dockerignore.
#
# The two component jobs repeat the same input block. A YAML anchor would be
# the obvious fix, but GitLab resolves `include` in its own pass, so anchors are
# not dependable there — keep the lists in sync by hand. What they share, and why:
#
#   registry_auth: gcp       Workload Identity against Artifact Registry.
#   *_registry               all three point at the SAME staging path. The
#                            component routes stable tags to
#                            `production_registry` and only pre-release tags to
#                            staging, so pointing every tier at staging is what
#                            keeps `v1.2.3` out of the production registry while
#                            still letting it publish.
#   push_to_sandbox: false   those registries are one identical string, so
#                            leaving sandbox on would push the same destination
#                            twice.
#   enable_signing/sbom      off for now: both need GCP KMS and Dependency Track
#                            access first.
#
# And where the extension differs from the keeper:
#
#   source_labels_enabled    off for the extension: OCI source labels land in the
#                            image config, whose digest is the code hash, and the
#                            verify command in REPRODUCIBILITY.md adds none, so
#                            the hashes would never match. On for the keeper,
#                            which nothing attests.
#   enable_kaniko_cache      off: the component never uses a cache for a stable
#                            release anyway, and for the extension a warm cache
#                            could hide a reproducibility regression.
#
# The jobs run on tags only (the component's default rules_condition,
# $CI_COMMIT_TAG) and keep its commit_provenance check: releases are cut from
# main, which is $CI_DEFAULT_BRANCH, so a tag on any other branch is refused.
# The jobs name no `needs`, so they wait for every earlier stage — nothing is
# published from a commit whose tests failed.
include:
  # Lint, hadolint and shellcheck for the whole repository; its own image
  # publication is switched off (FLARE_CI_DISABLE_RELEASE_IMAGE above).
  - component: gitlab.com/flarenetwork/ci-components-private/component@2
    inputs:
      image_name: "fce-usdx-oracle"
      runner_tags: ["flarenetwork-md"]

  # The release-image component pulls this in internally, but depending on that
  # is depending on its internals. Included explicitly because record-images uses
  # its `.gcp-wif-pipeliner-*` anchors to authenticate to Artifact Registry.
  - project: flarenetwork/ci-components-private
    ref: main
    file: templates/shared/common.yml

  ### EXTENSION TEE ###########################################################
  - component: gitlab.com/flarenetwork/ci-components-private/release-image@main
    inputs:
      job_name_suffix: "-extension-tee"
      image_name: tee-usdx
      # TEMP: run on this branch to exercise the pipeline; revert before merging.
      image_tag_source: commit_sha
      rules_condition: '$CI_COMMIT_TAG || $CI_COMMIT_REF_NAME == "aljaz/keeper-deployment"'
      registry_auth: gcp
      sandbox_registry: $REGISTRY
      staging_registry: $REGISTRY
      production_registry: $REGISTRY
      push_to_sandbox: false
      build_with_buildkit: true
      build_context: "."
      dockerfile_path: Dockerfile
      source_labels_enabled: false
      enable_kaniko_cache: false
      enable_signing: false
      enable_sbom: false

  ### KEEPER ##################################################################
  - component: gitlab.com/flarenetwork/ci-components-private/release-image@main
    inputs:
      job_name_suffix: "-keeper"
      image_name: fce-usdx-keeper
      # TEMP: run on this branch to exercise the pipeline; revert before merging.
      image_tag_source: commit_sha
      rules_condition: '$CI_COMMIT_TAG || $CI_COMMIT_REF_NAME == "aljaz/keeper-deployment"'
      registry_auth: gcp
      sandbox_registry: $REGISTRY
      staging_registry: $REGISTRY
      production_registry: $REGISTRY
      push_to_sandbox: false
      build_with_buildkit: true
      build_context: "."
      # keeper.Dockerfile.dockerignore beside it is read in place of .dockerignore.
      dockerfile_path: keeper.Dockerfile
      source_labels_enabled: true
      enable_kaniko_cache: false
      enable_signing: false
      enable_sbom: false
      build_args_enabled: true
      build_args: "CHAIN=$KEEPER_CHAIN"

# Reads both images back from the registry to prove the pushes landed, and
# exports what the rest of the flow consumes, under the names build-image.sh and
# build-keeper-image.sh write to out/images/: TEE_IMAGE and EXPECTED_CODE_HASH
# for the upload scripts and allow-tee-version, KEEPER_IMAGE_DIGEST for a server
# to pin. The code hash is the image's config digest — what Confidential Space
# reports as image_id — which the component does not expose, so it is read from
# the pushed manifest here.
record-images:
  stage: publish
  extends: .gcp-wif-pipeliner-base
  image:
    name: $PIPELINER_IMAGE
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
    # TEMP: run on this branch to exercise the pipeline; revert before merging.
    - if: $CI_COMMIT_REF_NAME == "aljaz/keeper-deployment"
  needs:
    - release-images-extension-tee
    - release-images-keeper
  variables:
    GOOGLE_APPLICATION_CREDENTIALS: $CI_PROJECT_DIR/.gcp
  before_script:
    - !reference [.gcp-wif-pipeliner-fetch-token, script]
    # Read-only, so the unprotected identity is both sufficient and the lesser grant.
    - gcp_wif_auth --is_protected false
  script:
    # TEMP: the SHA fallback matches the component's commit_sha tag; revert before merging.
    - TAG="${CI_COMMIT_TAG:-${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}}"
    - DIGEST="$(gcloud artifacts docker images describe "$IMAGE:$TAG" --format='value(image_summary.digest)')"
    - 'case "$DIGEST" in sha256:?*) ;; *) echo "bad digest for $IMAGE:$TAG [$DIGEST]"; exit 1 ;; esac'
    - KEEPER_DIGEST="$(gcloud artifacts docker images describe "$KEEPER_IMAGE:$TAG" --format='value(image_summary.digest)')"
    - 'case "$KEEPER_DIGEST" in sha256:?*) ;; *) echo "bad digest for $KEEPER_IMAGE:$TAG [$KEEPER_DIGEST]"; exit 1 ;; esac'
    # The manifest by digest, so what is read is what was just checked above. The
    # component builds without attestations, so it is a single image manifest
    # and not an index; anything else fails the shape check below.
    - REGISTRY_HOST="${REGISTRY%%/*}"
    - REPO_PATH="${IMAGE#*/}"
    - >-
      CONFIG_DIGEST="$(curl -fsSL
      -H "Authorization: Bearer $(gcloud auth print-access-token)"
      -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"
      "https://$REGISTRY_HOST/v2/$REPO_PATH/manifests/$DIGEST" | jq -r '.config.digest // empty')"
    - 'case "$CONFIG_DIGEST" in sha256:?*) ;; *) echo "no config digest in the manifest of $IMAGE@$DIGEST [$CONFIG_DIGEST]"; exit 1 ;; esac'
    # Absolute path: artifact paths are relative to CI_PROJECT_DIR, not cwd.
    - |
      {
        echo "TEE_IMAGE=$IMAGE@$DIGEST"
        echo "EXPECTED_CODE_HASH=0x${CONFIG_DIGEST#sha256:}"
        echo "IMAGE_COMMIT=$CI_COMMIT_SHA"
        echo "KEEPER_IMAGE=$KEEPER_IMAGE:$TAG"
        echo "KEEPER_IMAGE_DIGEST=$KEEPER_IMAGE@$KEEPER_DIGEST"
        echo "KEEPER_IMAGE_CHAIN=$KEEPER_CHAIN"
      } | tee "$CI_PROJECT_DIR/deploy.env"
  artifacts:
    reports:
      dotenv: deploy.env

# Rebuilds the extension cold and compares code hashes, so REPRODUCIBILITY.md's
# claim is actually checked. Deliberately not a component job: it verifies the
# component's output instead of trusting it, and a fresh pod means no BuildKit
# cache. It compares the config digest — the code hash — rather than the
# manifest digest, since that is what gets registered, and so needs no push.
# The buildctl invocation mirrors release-image.sh's BuildKit path exactly — same
# frontend, the one build arg, rewrite-timestamp, no source labels — because any
# extra option would change the digest and make the comparison meaningless.
# Manual and allow_failure: on NOT REPRODUCIBLE, do not register that code hash
# on chain.
verify-reproducible:
  stage: publish
  image:
    name: $BUILDKIT_IMAGE
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
    # TEMP: run on this branch to exercise the pipeline; revert before merging.
    - if: $CI_COMMIT_REF_NAME == "aljaz/keeper-deployment"
      when: manual
      allow_failure: true
  needs:
    - job: record-images
      artifacts: true
  variables:
    # Rootless BuildKit: flarenetwork's runners permit no privileged containers.
    # The annotation selects the buildkit-rootless AppArmor profile they preload.
    BUILDKITD_FLAGS: "--oci-worker-no-process-sandbox"
    KUBERNETES_POD_ANNOTATIONS_1: "container.apparmor.security.beta.kubernetes.io/build=localhost/buildkit-rootless"
  script:
    # record-images' dotenv sets EXPECTED_CODE_HASH to the published hash.
    - PUBLISHED="$EXPECTED_CODE_HASH"
    # The image runs as uid 1000 over a checkout the root runner helper made.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - SOURCE_DATE_EPOCH="$(git -C "$CI_PROJECT_DIR" log -1 --format=%ct)"
    - >-
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local "context=$CI_PROJECT_DIR"
      --local "dockerfile=$CI_PROJECT_DIR"
      --opt filename=Dockerfile
      --opt "build-arg:SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
      --metadata-file /tmp/verify-metadata.json
      --output "type=image,name=verify,push=false,rewrite-timestamp=true"
    - CONFIG_DIGEST="$(jq -r '."containerimage.config.digest" // empty' /tmp/verify-metadata.json)"
    - 'case "$CONFIG_DIGEST" in sha256:?*) ;; *) echo "buildkit metadata has no containerimage.config.digest"; exit 1 ;; esac'
    - REBUILT="0x${CONFIG_DIGEST#sha256:}"
    # Quoted: a bare `: ` in a plain YAML scalar parses as a mapping, not a string.
    - 'echo "published: $PUBLISHED ($TEE_IMAGE)"'
    - 'echo "rebuilt:   $REBUILT"'
    - test -n "$PUBLISHED" && test "$PUBLISHED" = "$REBUILT" || { echo "NOT REPRODUCIBLE — code hashes differ"; exit 1; }
