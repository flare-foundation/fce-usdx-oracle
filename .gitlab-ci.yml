# GitLab CI for the USDX oracle extension, after tee-node's pipeline: the same
# Go cache, lint and coverage arrangement, extended to what this repository is
# made of — two Go modules (the extension at the root, the operator tooling in
# tools/), the operator scripts, and the extension image. The Foundry project is not
# built here: its sources are upstream's, compiled from a sibling checkout of
# flare-smart-contracts-v2 that CI has no access to; its wire vectors reach CI
# as the fixtures the Go conformance test replays.
#
# The private image component at the end publishes the extension image the way
# tee-node's pipeline does; the kaniko job before it only proves that the
# Dockerfile builds, without pushing. The proxy is tee-proxy's own published
# image, pulled by the compose stack, not built here.

variables:
  # tools/go.mod needs 1.25.8; the minor tag tracks the latest patch.
  GOLANG_VERSION: "1.25"
  GOLINT_VERSION: "v2.7.0"
  COVERAGE_FILE: "coverage.out"
  COBERTURA_FILE: "coverage.xml"
  FLARE_CI_DISABLE_LGTM: true
  FLARE_CI_DISABLE_TEST_GO: true
  FLARE_CI_DISABLE_LINT_GO: true

default:
  tags:
    - flarenetwork

# One pipeline per push. A branch with an open merge request runs as that merge
# request's pipeline and not also as a branch pipeline, so the merge request
# shows every job.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# A job without rules runs only in branch and tag pipelines (GitLab's default of
# only: [branches, tags]). Every job below extends this, so it also runs in the
# merge request pipelines the workflow creates.
.run:
  rules:
    - when: on_success

stages:
  - build
  - test
  - image

.gocache:
  variables:
    GOPATH: ${CI_PROJECT_DIR}/.go
  before_script:
    - mkdir -p ${GOPATH}
  cache:
    key: go-${CI_COMMIT_REF_SLUG}
    paths:
      - ${GOPATH}/pkg/mod/
      - ${GOPATH}/bin

# ── build ─────────────────────────────────────────────────────────────────────

build:
  stage: build
  image: golang:${GOLANG_VERSION}
  extends: [.gocache, .run]
  needs: []
  script:
    - go mod download
    - go build ./...
    - cd tools && go mod download && go build ./...

# ── test ──────────────────────────────────────────────────────────────────────

# Formatting and vet, for both modules; what every commit must pass.
lint:
  stage: test
  needs: [build]
  image: golang:${GOLANG_VERSION}
  extends: [.gocache, .run]
  script:
    - "! gofmt -l $(git ls-files '*.go') | grep -q ."
    - go vet ./...
    - cd tools && go vet ./...

# tee-node's linter set (.golangci.yml), over both modules.
golangci:
  stage: test
  needs: [build]
  image: golangci/golangci-lint:${GOLINT_VERSION}
  extends: [.gocache, .run]
  script:
    - golangci-lint run --timeout 10m0s ./...
    - cd tools && golangci-lint run --timeout 10m0s ./...

# The extension's tests, with the wire-contract conformance replay
# (internal/extension TestConformance) among them, and the tooling's.
test:
  stage: test
  image: golang:${GOLANG_VERSION}
  needs: [build]
  extends: [.gocache, .run]
  before_script:
    - mkdir -p ${GOPATH}
    - go get github.com/boumenot/gocover-cobertura
  script:
    - go test -v -coverpkg=fce-usdx-oracle/... -coverprofile=${COVERAGE_FILE} -covermode count ./...
    - go tool cover -func=${COVERAGE_FILE}
    - go run github.com/boumenot/gocover-cobertura < ${COVERAGE_FILE} > ${COBERTURA_FILE}
    - cd tools && go test ./...
  artifacts:
    paths:
      - ${COVERAGE_FILE}
    reports:
      coverage_report:
        coverage_format: cobertura
        path: ${COBERTURA_FILE}
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'

# The operator scripts: every one parses, and the dependency pins the two Go
# modules and the proxy image carry agree (check-versions.sh).
scripts:
  stage: test
  needs: []
  extends: .run
  image: golang:${GOLANG_VERSION}
  script:
    - for f in deploy/scripts/*.sh deploy/scripts/lib/*.sh; do bash -n "$f"; done
    - ./deploy/scripts/check-versions.sh

# ── images ────────────────────────────────────────────────────────────────────

# The extension image is reproducible from SOURCE_DATE_EPOCH, the commit's
# timestamp; kaniko's image has no git, so the value is taken here and handed
# on as a dotenv artifact.
epoch:
  stage: build
  needs: []
  extends: .run
  image: golang:${GOLANG_VERSION}
  script:
    - echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" > build.env
  artifacts:
    reports:
      dotenv: build.env

.kaniko:
  extends: .run
  stage: image
  image:
    name: registry.gitlab.com/flarenetwork/infra-public/pipeliner/kaniko-executor-stbl:v1.23.2-debug
    entrypoint: [""]
  script:
    - >-
      args="--context ${CI_PROJECT_DIR}
        --dockerfile ${CI_PROJECT_DIR}/${DOCKERFILE}
        ${BUILD_ARGS}
        --registry-mirror mirror.gcr.io
        --compressed-caching=false
        --snapshot-mode=redo
        --no-push"
    - /kaniko/executor $args

# The extension TEE image, the one a Confidential Space VM runs.
image-extension:
  extends: .kaniko
  needs: [build, epoch]
  variables:
    DOCKERFILE: "Dockerfile"
    BUILD_ARGS: "--build-arg SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"

# Publication of the extension image, as tee-node's pipeline does it.
include:
  - component: gitlab.com/flarenetwork/ci-components-private/component@2
    inputs:
      image_name: "fce-usdx-oracle"
      runner_tags: ["flarenetwork-md"]
