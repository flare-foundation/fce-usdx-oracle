# Docker Compose override for Coston (chain_id=16) deployment.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.coston.yaml up -d
#
# The proxy needs a chain indexer DB on host.docker.internal:3306. Bring up the
# existing Coston indexer (already wired to the new FlareTeeManager diamond)
# beforehand:
#   cd ../../e2e/docker/coston && docker compose up -d coston-indexer-db coston-indexer
services:
  ext-proxy:
    volumes:
      - ./config/proxy/extension_proxy.coston.docker.toml:/app/config/config.toml:ro
    environment:
      # The coston TOML enables [direct] with api_key_variable = "DIRECT_API_KEY",
      # so the proxy refuses to start without it rather than exposing an
      # unauthenticated /direct on the public external port.
      - DIRECT_API_KEY=${DIRECT_API_KEY:?direct mode is enabled in the coston proxy config — set DIRECT_API_KEY in .env}

  extension-tee:
    environment:
      - CHAIN_URL=${CHAIN_URL:-https://coston-api.flare.network/ext/C/rpc}
      # Coston chain id. The node binds every signature to this value; it must
      # match the proxy's chain_id and the on-chain registry, or signature
      # verification fails (InvalidTeePublicKeyOrSignature / proxy panic).
      - CHAIN_ID=${CHAIN_ID:-16}

networks:
  default:
    name: ${COMPOSE_NETWORK:-fce-usdx-oracle-coston}
    external: false
