# The Coston C-chain indexer and its MySQL database. The extension proxy reads
# signing policies, voter registrations and relay finalisations from this
# database. The configuration under config/indexer/coston/ is rendered by
# import-upstream-addresses.sh coston (or coston_local) from the chain's
# addresses, with a seven-day history.
#
# A file of its own so the indexer runs without the rest of the stack and
# without any variable set:
#   docker compose -f deploy/docker-compose.coston-indexer.yaml up -d
#   docker compose -f deploy/docker-compose.coston-indexer.yaml logs -f coston-indexer
# It serves both Coston rows, coston and coston_local. The stack
# start-services.sh brings up for either is in the same compose project
# (`deploy`, the directory of the first file) and on the same network (below),
# so the proxy reaches coston-indexer-db by name. start-services.sh never starts
# the indexer: it reads the indexer's lag through this file, and with --local it
# adds this file to the set it starts redis from, so compose counts these
# containers as the project's own rather than as orphans.
#
# At start the indexer indexes the chain from seven days back and prunes older
# rows as it advances; the proxy's policy fetches fail until it has caught up,
# some minutes on a fresh database. The tables are dropped on every start.
services:
  coston-indexer-db:
    image: "mysql"
    environment:
      MYSQL_ROOT_PASSWORD: "root"
    volumes:
      - ./config/indexer/c-chain-init.sql:/docker-entrypoint-initdb.d/db_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent", "--host", "localhost", "-proot"]
      timeout: 20s
      retries: 10
    ports:
      # For looking at the database from the host only; the proxy and the
      # indexer reach it over the compose network. 3316 so it does not clash
      # with the e2e repository's own Coston indexer on 3306.
      - "${INDEXER_DB_BIND:-127.0.0.1:3316}:3306"

  coston-indexer:
    image: ghcr.io/flare-foundation/flare-system-c-chain-indexer:main
    volumes:
      - ./config/indexer/coston/indexer-config.toml:/app/config.toml:ro
    restart: unless-stopped
    depends_on:
      coston-indexer-db:
        condition: service_healthy

# The network the live overlay gives a Coston stack (start-services.sh sets
# COMPOSE_NETWORK to this name for coston and coston_local alike), so the proxy
# resolves coston-indexer-db.
networks:
  default:
    name: ${COMPOSE_NETWORK:-fce-usdx-oracle-coston}
    external: false
