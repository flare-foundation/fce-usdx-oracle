# Overlay selected by `USE_LOCAL_SIBLINGS=1 ./deploy/scripts/start-services.sh`.
# It swaps the default self-contained, pinned node build (context .., Dockerfile)
# for the sibling-based build (context tee/, Dockerfile.siblings.dev) so an on-disk
# tee-node checkout is compiled into the node instead of the pinned module version.
#
# Go-only: the sibling build compiles tee-node into the Go extension binary.
# start-services.sh rejects USE_LOCAL_SIBLINGS for other languages, which build
# tee-node as a separate binary from a pinned ref instead.
#
# Not chain-specific — start-services.sh attaches it after docker-compose.yaml and
# before any coston/coston2 overlay.
services:
  extension-tee:
    build:
      context: ../../..
      dockerfile: extension-examples/fce-usdx-oracle/Dockerfile.siblings.dev
      args:
        # Module source for the in-image download. start-services.sh serves the
        # host module cache for the build's duration (scripts/lib/modcache-proxy.sh).
        GOPROXY: ${GOPROXY_BUILD:-https://proxy.golang.org,direct}
